# resbrotherx.com on the shared Ubuntu server, behind Cloudflare.
# The one public address is https://www.resbrotherx.com (the address Apsuni,
# AnimeDoc and Adorė already link to).
# Certificate: Let's Encrypt, renewed by certbot's timer (webroot /var/www/letsencrypt).

# ---------- Plain HTTP: certificate checks only, everything else goes to HTTPS ----------
server {
    listen 80;
    server_name resbrotherx.com www.resbrotherx.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://www.resbrotherx.com$request_uri; }
}

# ---------- resbrotherx.com -> www.resbrotherx.com ----------
server {
    listen 443 ssl http2;
    server_name resbrotherx.com;
    ssl_certificate /etc/letsencrypt/live/resbrotherx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resbrotherx.com/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://www.resbrotherx.com$request_uri; }
}

# ---------- The website ----------
server {
    listen 443 ssl http2;
    server_name www.resbrotherx.com;
    ssl_certificate /etc/letsencrypt/live/resbrotherx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resbrotherx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/resbrotherx-common.conf;
}
