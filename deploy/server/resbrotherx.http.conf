# resbrotherx.com: first-time setup, before the domain points here.
# deploy.sh installs this when the server has no resbrotherx site yet;
# enable-https.sh replaces it with resbrotherx.conf once the certificate exists.

# Answers for the domain over plain HTTP, so Let's Encrypt can verify it.
server {
    listen 80;
    server_name resbrotherx.com www.resbrotherx.com;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/resbrotherx-common.conf;
}

# Preview by IP address while the domain is not connected: http://SERVER_IP:8090
# Search engines are told not to index it. It is removed when HTTPS is enabled.
server {
    listen 8090;
    server_name _;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/resbrotherx-common.conf;
}
