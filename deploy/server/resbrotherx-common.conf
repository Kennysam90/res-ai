# Shared by every resbrotherx.com server block: where the files are, how long
# browsers may keep them, and the security headers.
#
# No add_header inside a location: Nginx drops the server-level headers from any
# location that declares its own. Cache lifetimes use "expires" instead.
root /srv/resbrotherx/web;
index index.html;
charset utf-8;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css text/plain application/javascript application/json application/ld+json application/xml application/rss+xml application/feed+json application/manifest+json image/svg+xml;

location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

# Build files carry a fingerprint in their name, so they can be kept for a year.
location ~ ^/assets/[^/]+\.(?:js|css|woff2?)$ { expires 1y; access_log off; try_files $uri =404; }
# Pictures keep their names when they are replaced, so they are kept for a month.
location /assets/ { expires 30d; access_log off; try_files $uri =404; }
location ~ ^/(?:icons|og)/ { expires 30d; try_files $uri =404; }
location = /favicon.ico { expires 30d; access_log off; try_files $uri =404; }

# Files read by crawlers, feed readers and AI assistants.
location = /feed.xml { types { } default_type "application/rss+xml; charset=utf-8"; expires 1h; }
location = /feed.json { types { } default_type "application/feed+json; charset=utf-8"; expires 1h; }
location = /site.webmanifest { types { } default_type application/manifest+json; expires 7d; }
location ~ ^/(?:robots|llms|llms-full|humans)\.txt$ { expires 1h; try_files $uri =404; }
location = /sitemap.xml { expires 1h; try_files $uri =404; }

# Unknown addresses get the 404 page with a real 404 status, never the home page.
error_page 404 /404.html;
location = /404.html { internal; expires -1; }

# One address per page: /about, not /about/ or /about/index.html.
location = /index.html { return 301 /; }
location ~ ^/(.+)/index\.html$ { return 301 /$1; }
location ~ ^/(.+)/$ { return 301 /$1; }

# Pages: always checked with the server, so an update shows at once.
location / {
    expires -1;
    try_files $uri/index.html $uri =404;
}
